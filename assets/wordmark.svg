<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 180" width="756" height="180" role="img" aria-label="IOloom">
  <title>IOloom</title>

  <defs>
    <!-- Control-circuit blue into the cyan of a lit PLC input. -->
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#0891b2"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a5f3fc"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="756" height="180" rx="16" fill="#082f49"/>
  <rect x="6" y="6" width="744" height="168" rx="11"
        fill="none" stroke="#22d3ee" stroke-opacity="0.28" stroke-width="2"/>

  <!-- The threads of the loom: control wires in the colours of IEC 60204-1,
       dark blue for DC control, red for AC control, orange for external
       supply. They run behind the word, as warp threads run behind cloth. -->
  <g stroke-width="3" fill="none" opacity="0.5">
    <path d="M196 52 H736" stroke="#3b82f6"/>
    <path d="M196 90 H736" stroke="#ef4444"/>
    <path d="M196 128 H736" stroke="#f97316"/>
  </g>

  <!-- A ladder rung: two rails, a normally open contact, and a coil. -->
  <g stroke="#22d3ee" stroke-width="4" fill="none" stroke-linecap="round" filter="url(#glow)">
    <path d="M36 30 V150"/>
    <path d="M176 30 V150"/>
    <path d="M36 90 H70"/>
    <path d="M70 72 V108"/>
    <path d="M86 72 V108"/>
    <path d="M86 90 H112"/>
    <path d="M118 74 A16 16 0 0 0 118 106"/>
    <path d="M134 74 A16 16 0 0 1 134 106"/>
    <path d="M140 90 H176"/>
  </g>

  <text x="214" y="122" fill="url(#ink)" filter="url(#glow)"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="104" font-weight="700" letter-spacing="2">IOloom</text>
</svg>
