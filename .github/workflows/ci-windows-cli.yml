name: CI - Windows CLI

on:
  workflow_call:

jobs:
  config-channel:
    name: Daemon Config Channel (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # The CLI sends the daemon config over a named pipe on Windows (upstream issue 1188).
      # This runs the channel tests on the platform that uses the pipe.
      - name: Run the config channel tests
        run: npx jest src/cli/__tests__/config-channel.test.ts
